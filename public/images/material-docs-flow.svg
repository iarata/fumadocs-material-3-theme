<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">From MDX to a Material documentation page</title><desc id="desc">Content files are compiled by Fumadocs and displayed with Material components.</desc><style>
.bg{fill:#f4f6fc}.t1{fill:#cde5ff}.t2{fill:#d6dee7}.t3{fill:#f1e3ff}.h,.h1{fill:#001d32}.h2{fill:#121d25}.h3{fill:#23123b}.m{fill:#41474f}.arw{stroke:#006398}
@media (prefers-color-scheme: dark){.bg{fill:#1e2226}.t1{fill:#004b74}.t2{fill:#323d46}.t3{fill:#503e6a}.h{fill:#ebf1fa}.h1{fill:#cde5ff}.h2{fill:#d9e4f0}.h3{fill:#eddcff}.m{fill:#c1c7d0}.arw{stroke:#94ccff}}
</style>
  <rect width="1200" height="600" rx="24" class="bg"/>
  <text x="64" y="90" font-family="Arial,sans-serif" font-size="36" font-weight="700" class="h">A guide, from source to screen</text>
  <g font-family="Arial,sans-serif">
    <rect x="64" y="180" width="300" height="270" rx="20" class="t1"/><text x="92" y="233" class="h1" font-size="24" font-weight="700">1. Write MDX</text><text x="92" y="288" class="m" font-size="20">Headings and prose</text><text x="92" y="326" class="m" font-size="20">Code and type definitions</text><text x="92" y="364" class="m" font-size="20">Reusable components</text>
    <rect x="450" y="180" width="300" height="270" rx="20" class="t2"/><text x="478" y="233" class="h2" font-size="24" font-weight="700">2. Compile</text><text x="478" y="288" class="m" font-size="20">Fumadocs content pipeline</text><text x="478" y="326" class="m" font-size="20">Search and page tree</text><text x="478" y="364" class="m" font-size="20">Generated API reference</text>
    <rect x="836" y="180" width="300" height="270" rx="20" class="t3"/><text x="864" y="233" class="h3" font-size="24" font-weight="700">3. Read and explore</text><text x="864" y="288" class="m" font-size="20">Material components</text><text x="864" y="326" class="m" font-size="20">Light and dark themes</text><text x="864" y="364" class="m" font-size="20">Keyboard and mobile UI</text>
  </g>
  <g class="arw" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M384 315h42m-12-12 12 12-12 12"/><path d="M770 315h42m-12-12 12 12-12 12"/></g>
  <text x="64" y="530" font-family="Arial,sans-serif" font-size="18" class="m">One content source. Consistent navigation, colour roles, and interaction states.</text>
</svg>
